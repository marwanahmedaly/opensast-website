<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 465" role="img" aria-labelledby="title desc"><title id="title">How a repository becomes a reviewable finding</title><desc id="desc">A repository snapshot feeds stock CodeQL, 35 custom queries and template analysis. Suspected operations feed automatic evidence gathering, then local Qwen and output validation. Accepted alerts need human review; negative decisions, unresolved decisions and system errors are retained separately.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f4f4}.title{font-size:19px;font-weight:600}.body{font-size:15px;fill:#c6c6c6}.label{font-size:12px;fill:#42d9e8;letter-spacing:1px}.node{fill:#161c22;stroke:#3e4b53;stroke-width:1.5}.accent{fill:#1c3037;stroke:#42d9e8;stroke-width:1.5}.edge{fill:none;stroke:#42d9e8;stroke-width:2;marker-end:url(#arrow)}.possible{stroke-dasharray:6 5}.note{font-size:13px;fill:#c6c6c6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#42d9e8"/></marker></defs><rect x="10" y="20" width="205" height="122" rx="4" class="node"/><text x="30" y="45" class="label">INPUT</text><text x="30" y="73" class="title">Python repository</text><text x="30" y="101" class="body">Pinned scan snapshot</text><text x="30" y="124" class="body">Source + templates</text><rect x="275" y="20" width="360" height="122" rx="4" class="node"/><text x="295" y="45" class="label">01 / STATIC ANALYSIS</text><text x="295" y="73" class="title">Discover suspects</text><text x="295" y="101" class="body">Stock CodeQL + 35 custom queries</text><text x="295" y="124" class="body">Template analysis</text><rect x="695" y="20" width="410" height="122" rx="4" class="node"/><text x="715" y="45" class="label">02 / CONTEXT</text><text x="715" y="73" class="title">Gather evidence</text><text x="715" y="101" class="body">Code relationships + file/line references</text><text x="715" y="124" class="body">Fit packet; record evidence omissions</text><path d="M215 80H270" class="edge"/><path d="M635 80H690" class="edge"/><path d="M900 142V184H565V215" class="edge"/><rect x="340" y="220" width="450" height="120" rx="4" class="accent"/><text x="360" y="245" class="label">03 / VERIFICATION</text><text x="360" y="273" class="title">Local Qwen + output validation</text><text x="360" y="301" class="body">One LLM verification stage</text><text x="360" y="324" class="body">Structured verdict + evidence references</text><path d="M565 340V365H200V390" class="edge"/><path d="M565 340V365H910V390" class="edge"/><rect x="10" y="395" width="385" height="60" rx="4" class="node"/><text x="30" y="425" class="title">Accepted alert → human review</text><rect x="685" y="395" width="420" height="60" rx="4" class="node"/><text x="705" y="425" class="title">Negative / unresolved / system error</text></svg>
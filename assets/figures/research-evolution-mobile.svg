<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 815" role="img" aria-labelledby="title desc"><title id="title">Why the research approach changed</title><desc id="desc">AST excerpts and autonomous agent investigation exposed missing context and cost. Source-first classification exposed an impractical workload. The evaluated approach uses static suspects, focused code evidence and a local verifier; evaluation then exposes coverage, precision and runtime limits.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f4f4}.title{font-size:19px;font-weight:600}.body{font-size:15px;fill:#c6c6c6}.label{font-size:12px;fill:#42d9e8;letter-spacing:1px}.node{fill:#161c22;stroke:#3e4b53;stroke-width:1.5}.accent{fill:#1c3037;stroke:#42d9e8;stroke-width:1.5}.edge{fill:none;stroke:#42d9e8;stroke-width:2;marker-end:url(#arrow)}.possible{stroke-dasharray:6 5}.note{font-size:13px;fill:#c6c6c6}.title{font-size:20px}.body{font-size:17px}.label{font-size:13px}.note{font-size:15px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#42d9e8"/></marker></defs><rect x="10" y="10" width="370" height="108" rx="4" class="node"/><text x="30" y="35" class="label">EARLY EXPLORATION</text><text x="30" y="63" class="title">AST excerpts</text><text x="30" y="91" class="body">Missing context + expensive requests</text><rect x="10" y="142" width="370" height="108" rx="4" class="node"/><text x="30" y="167" class="label">EARLY EXPLORATION</text><text x="30" y="195" class="title">Autonomous agents</text><text x="30" y="223" class="body">Resource limits + incomplete review</text><path d="M195 118V140" class="edge"/><path d="M195 250V280" class="edge"/><rect x="10" y="285" width="370" height="155" rx="4" class="node"/><text x="30" y="310" class="label">INTERMEDIATE APPROACH</text><text x="30" y="338" class="title">Source-first pipeline</text><text x="30" y="366" class="body">LLM specifications → CodeQL</text><text x="30" y="389" class="body">→ LLM verification</text><text x="30" y="412" class="body">Impractical projected workload</text><path d="M195 440V470" class="edge"/><rect x="10" y="475" width="370" height="155" rx="4" class="accent"/><text x="30" y="500" class="label">CURRENT RESEARCH SYSTEM</text><text x="30" y="528" class="title">Evaluated OpenSAST</text><text x="30" y="556" class="body">Static suspects → focused context</text><text x="30" y="579" class="body">→ one local verifier</text><text x="30" y="602" class="body">Coverage, noise and runtime limits</text><text x="20" y="675" class="note">Design history. Earlier approaches overlapped;</text><text x="20" y="699" class="note">the arrow shows research progression.</text><text x="20" y="735" class="note">This is not a controlled accuracy comparison.</text></svg>
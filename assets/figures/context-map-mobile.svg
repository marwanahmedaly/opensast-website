<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 875" role="img" aria-labelledby="title desc"><title id="title">The evidence gathered around a suspected operation</title><desc id="desc">A suspected operation anchors collection of its enclosing code, producers and assignments, callers, uses and defenses. Related excerpts retain file/line references and evidence IDs, and are fitted into a packet for the verifier. Links describe possible relationships rather than a proven execution path.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f4f4}.title{font-size:19px;font-weight:600}.body{font-size:15px;fill:#c6c6c6}.label{font-size:12px;fill:#42d9e8;letter-spacing:1px}.node{fill:#161c22;stroke:#3e4b53;stroke-width:1.5}.accent{fill:#1c3037;stroke:#42d9e8;stroke-width:1.5}.edge{fill:none;stroke:#42d9e8;stroke-width:2;marker-end:url(#arrow)}.possible{stroke-dasharray:6 5}.note{font-size:13px;fill:#c6c6c6}.title{font-size:20px}.body{font-size:17px}.label{font-size:13px}.note{font-size:15px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#42d9e8"/></marker></defs><rect x="10" y="10" width="370" height="104" rx="4" class="accent"/><text x="30" y="40" class="title">Suspected operation</text><text x="30" y="68" class="body">CWE + file/line + enclosing code</text><path d="M195 114V144" class="edge possible"/><rect x="10" y="149" width="370" height="104" rx="4" class="node"/><text x="30" y="179" class="title">Value origins</text><text x="30" y="207" class="body">Declarations, assignments, constructors</text><path d="M195 253V283" class="edge possible"/><rect x="10" y="288" width="370" height="104" rx="4" class="node"/><text x="30" y="318" class="title">Callers and arguments</text><text x="30" y="346" class="body">Possible call and parameter bindings</text><path d="M195 392V422" class="edge possible"/><rect x="10" y="427" width="370" height="104" rx="4" class="node"/><text x="30" y="457" class="title">Uses and defenses</text><text x="30" y="485" class="body">Consumers, templates, guards, escaping</text><path d="M195 531V561" class="edge"/><rect x="10" y="566" width="370" height="150" rx="4" class="accent"/><text x="30" y="596" class="title">Evidence packet → local Qwen</text><text x="30" y="624" class="body">Exact excerpts, IDs, file/line references</text><text x="30" y="647" class="body">Deduplicate and fit the token budget</text><text x="30" y="670" class="body">Record evidence omissions</text><text x="20" y="762" class="note">Dashed links indicate possible relationships.</text><text x="20" y="786" class="note">Collection groups are illustrative, not a required</text><text x="20" y="810" class="note">execution order or a proven data-flow path.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 865" role="img" aria-labelledby="title desc"><title id="title">How a repository becomes a reviewable finding</title><desc id="desc">A repository snapshot feeds stock CodeQL, 35 custom queries and template analysis. Suspected operations feed automatic evidence gathering, then local Qwen and output validation. Accepted alerts need human review; negative decisions, unresolved decisions and system errors are retained separately.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f4f4}.title{font-size:19px;font-weight:600}.body{font-size:15px;fill:#c6c6c6}.label{font-size:12px;fill:#42d9e8;letter-spacing:1px}.node{fill:#161c22;stroke:#3e4b53;stroke-width:1.5}.accent{fill:#1c3037;stroke:#42d9e8;stroke-width:1.5}.edge{fill:none;stroke:#42d9e8;stroke-width:2;marker-end:url(#arrow)}.possible{stroke-dasharray:6 5}.note{font-size:13px;fill:#c6c6c6}.title{font-size:20px}.body{font-size:17px}.label{font-size:13px}.note{font-size:15px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#42d9e8"/></marker></defs><rect x="10" y="10" width="370" height="100" rx="4" class="node"/><text x="30" y="35" class="label">INPUT</text><text x="30" y="63" class="title">Python repository</text><text x="30" y="91" class="body">Pinned source + template snapshot</text><path d="M195 110V140" class="edge"/><rect x="10" y="145" width="370" height="132" rx="4" class="node"/><text x="30" y="170" class="label">01 / STATIC ANALYSIS</text><text x="30" y="198" class="title">Discover suspects</text><text x="30" y="226" class="body">Stock CodeQL + 35 custom queries</text><text x="30" y="249" class="body">Template analysis</text><path d="M195 277V307" class="edge"/><rect x="10" y="312" width="370" height="132" rx="4" class="node"/><text x="30" y="337" class="label">02 / CONTEXT</text><text x="30" y="365" class="title">Gather repository evidence</text><text x="30" y="393" class="body">Code relationships + file/line references</text><text x="30" y="416" class="body">Fit packet; record missing evidence</text><path d="M195 444V474" class="edge"/><rect x="10" y="479" width="370" height="132" rx="4" class="accent"/><text x="30" y="504" class="label">03 / VERIFICATION</text><text x="30" y="532" class="title">Local Qwen + validation</text><text x="30" y="560" class="body">One LLM verification stage</text><text x="30" y="583" class="body">Structured verdict + evidence references</text><path d="M195 611V641" class="edge"/><rect x="10" y="646" width="370" height="82" rx="4" class="node"/><text x="30" y="676" class="title">Accepted alert</text><text x="30" y="704" class="body">Requires human review</text><rect x="10" y="755" width="370" height="100" rx="4" class="node"/><text x="30" y="785" class="title">Other recorded outcomes</text><text x="30" y="813" class="body">Negative decision, unresolved decision</text><text x="30" y="836" class="body">or system error</text><path d="M195 611V629H385V805H382" class="edge"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 370" role="img" aria-labelledby="title desc"><title id="title">Why the research approach changed</title><desc id="desc">AST excerpts and autonomous agent investigation exposed missing context and cost. Source-first classification exposed an impractical workload. The evaluated approach uses static suspects, focused code evidence and a local verifier; evaluation then exposes coverage, precision and runtime limits.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f4f4}.title{font-size:19px;font-weight:600}.body{font-size:15px;fill:#c6c6c6}.label{font-size:12px;fill:#42d9e8;letter-spacing:1px}.node{fill:#161c22;stroke:#3e4b53;stroke-width:1.5}.accent{fill:#1c3037;stroke:#42d9e8;stroke-width:1.5}.edge{fill:none;stroke:#42d9e8;stroke-width:2;marker-end:url(#arrow)}.possible{stroke-dasharray:6 5}.note{font-size:13px;fill:#c6c6c6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#42d9e8"/></marker></defs><rect x="10" y="15" width="330" height="122" rx="4" class="node"/><text x="30" y="40" class="label">EARLY EXPLORATION</text><text x="30" y="68" class="title">AST excerpts</text><text x="30" y="96" class="body">Code fragments → local model</text><text x="30" y="119" class="body">Gap: missing context and time</text><rect x="10" y="182" width="330" height="122" rx="4" class="node"/><text x="30" y="207" class="label">EARLY EXPLORATION</text><text x="30" y="235" class="title">Autonomous agents</text><text x="30" y="263" class="body">Tools → repository investigation</text><text x="30" y="286" class="body">Gap: resources and incomplete review</text><path d="M340 76H368V160H393" class="edge"/><path d="M340 243H368V160H393" class="edge"/><rect x="398" y="90" width="300" height="150" rx="4" class="node"/><text x="418" y="115" class="label">INTERMEDIATE APPROACH</text><text x="418" y="143" class="title">Source-first pipeline</text><text x="418" y="171" class="body">LLM specifications → CodeQL</text><text x="418" y="194" class="body">→ LLM verification</text><text x="418" y="217" class="body">Gap: inference workload</text><path d="M698 160H752" class="edge"/><rect x="757" y="90" width="353" height="150" rx="4" class="accent"/><text x="777" y="115" class="label">CURRENT RESEARCH SYSTEM</text><text x="777" y="143" class="title">Evaluated OpenSAST</text><text x="777" y="171" class="body">Static suspects → focused context</text><text x="777" y="194" class="body">→ one local verifier</text><text x="777" y="217" class="body">Limits: coverage, noise and runtime</text><text x="560" y="350" text-anchor="middle" class="note">A history of design decisions, not a controlled accuracy comparison between all approaches.</text></svg>
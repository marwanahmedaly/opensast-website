<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 465" role="img" aria-labelledby="title desc"><title id="title">The evidence gathered around a suspected operation</title><desc id="desc">A suspected operation anchors collection of its enclosing code, producers and assignments, callers, uses and defenses. Related excerpts retain file/line references and evidence IDs, and are fitted into a packet for the verifier. Links describe possible relationships rather than a proven execution path.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f4f4}.title{font-size:19px;font-weight:600}.body{font-size:15px;fill:#c6c6c6}.label{font-size:12px;fill:#42d9e8;letter-spacing:1px}.node{fill:#161c22;stroke:#3e4b53;stroke-width:1.5}.accent{fill:#1c3037;stroke:#42d9e8;stroke-width:1.5}.edge{fill:none;stroke:#42d9e8;stroke-width:2;marker-end:url(#arrow)}.possible{stroke-dasharray:6 5}.note{font-size:13px;fill:#c6c6c6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#42d9e8"/></marker></defs><rect x="390" y="160" width="340" height="114" rx="4" class="accent"/><text x="410" y="190" class="title">Suspected operation</text><text x="410" y="218" class="body">CWE + exact file and line</text><text x="410" y="241" class="body">Enclosing function or class</text><rect x="10" y="10" width="335" height="104" rx="4" class="node"/><text x="30" y="40" class="title">Value origins</text><text x="30" y="68" class="body">Declarations, assignments, constructors</text><rect x="775" y="10" width="335" height="104" rx="4" class="node"/><text x="795" y="40" class="title">Callers and arguments</text><text x="795" y="68" class="body">Callers, arguments, possible bindings</text><rect x="10" y="320" width="335" height="104" rx="4" class="node"/><text x="30" y="350" class="title">Uses of the value</text><text x="30" y="378" class="body">Consumers, field writers, templates</text><rect x="775" y="320" width="335" height="104" rx="4" class="node"/><text x="795" y="350" class="title">Guards and defenses</text><text x="795" y="378" class="body">Guards, escaping, parameter binding</text><path d="M345 62H370V188H385" class="edge possible"/><path d="M775 62H750V188H735" class="edge possible"/><path d="M345 372H370V248H385" class="edge possible"/><path d="M775 372H750V248H735" class="edge possible"/><path d="M560 274V307" class="edge"/><rect x="390" y="312" width="340" height="112" rx="4" class="node"/><text x="410" y="342" class="title">Traceable evidence packet</text><text x="410" y="370" class="body">Exact excerpts + evidence IDs</text><text x="410" y="393" class="body">Deduplication + token-budget fitting</text><text x="560" y="456" text-anchor="middle" class="note">Dashed links: possible code relationships. Missing evidence is recorded.</text></svg>